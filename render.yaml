# Render Blueprint: New -> Blueprint -> select this repository.
# Creates a free PostgreSQL instance and the API built from the Dockerfile.
services:
  - type: web
    name: business-card-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: business-card-db
          property: connectionString

databases:
  - name: business-card-db
    plan: free
    databaseName: card
    user: card
